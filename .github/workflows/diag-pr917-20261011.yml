name: Validate PR 917 exact head
on:
  push:
    branches: [diag/validate-pr917-20261011]
permissions:
  contents: read
jobs:
  lint-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Full quality and coverage suite
        run: uv run just check
      - name: MCP distribution packaging
        run: |
          uv build --project mcp --out-dir dist/mcp
          uv run python tests/verify_mcp_dist.py dist/mcp/*.whl dist/mcp/*.tar.gz
      - name: Git diff formatting
        run: git diff --check HEAD~1 HEAD
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Live local OpenAPI fuzz contract test
        run: uv run just contract
